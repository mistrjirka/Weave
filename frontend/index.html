<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f5" />
    <script>
      // Resolve before the stylesheet paints, including on a direct deep link.
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("weave.theme");
          if (saved === "light" || saved === "dark" || saved === "black")
            preference = saved;
        } catch {}
        const theme =
          preference === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        const root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = theme;
        root.style.colorScheme = theme === "light" ? "light" : "dark";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute(
            "content",
            { light: "#f7f9f5", dark: "#101a15", black: "#111113" }[theme],
          );
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Weave — Neural Graph Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
