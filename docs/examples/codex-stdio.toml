[mcp_servers.weave]
command = "/absolute/path/to/Weave/.venv/bin/python"
args = ["-m", "backend.mcp_bridge"]
cwd = "/absolute/path/to/Weave"
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.weave.env]
WEAVE_MCP_URL = "http://127.0.0.1:8173"

# To pass a training access code from the parent environment, add
# env_vars = ["WEAVE_TRAINING_TOKEN"] under [mcp_servers.weave], above .env.
